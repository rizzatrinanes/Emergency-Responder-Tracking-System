<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rescuer Command & Control</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>

    <style>
        :root {
            --primary: #e74c3c;
            --secondary: #3498db;
            --success: #2ecc71;
            --bg: #f4f7f6;
            --card-bg: rgba(255, 255, 255, 0.9);
            --border: rgba(0, 0, 0, 0.1);
            --text: #2c3e50;
            --alert: #ff0000;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 3px solid var(--primary);
            padding-bottom: 10px;
        }

        h2 {
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--primary);
            margin: 0;
        }

        .status-badge {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-left: 10px;
        }

        .status-online { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .status-offline { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .hw-connected { background: #cce5ff; color: #004085; border: 1px solid #b8daff; }
        .hw-searching { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 25px;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: 0.3s;
        }

        .card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 5px; height: 100%;
            background: var(--primary);
            border-radius: 15px 0 0 15px;
        }

        /* AUTOMATIC EMERGENCY ANIMATION */
        .card.emergency-alert {
            background: #fff5f5 !important;
            border: 2px solid var(--alert) !important;
            animation: pulse-red 1s infinite alternate;
        }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 5px rgba(231, 76, 60, 0.4); }
            100% { box-shadow: 0 0 20px rgba(231, 76, 60, 0.9); }
        }

        .card.location::before { background: var(--secondary); }

        .card h3 {
            margin: 0 0 10px 0;
            font-size: 1rem;
            color: #7f8c8d;
            text-transform: uppercase;
        }

        .card i {
            position: absolute;
            right: 20px;
            top: 20px;
            font-size: 1.5rem;
            color: #bdc3c7;
        }

        .bpm-val {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            color: var(--primary);
        }

        .pulse-icon {
            animation: heartbit 1s infinite;
            color: var(--primary);
        }

        @keyframes heartbit {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .geo-info {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            color: var(--secondary);
            margin: 5px 0;
        }

        #map {
            height: 450px;
            width: 100%;
            border-radius: 15px;
            border: 2px solid #fff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .cmd-section {
            background: white;
            padding: 25px;
            border-radius: 15px;
            border: 1px solid var(--border);
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        input {
            flex: 1;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #ddd;
            font-size: 1rem;
            outline: none;
        }

        button {
            background: var(--success);
            color: white;
            border: none;
            padding: 0 25px;
            border-radius: 10px;
            font-weight: bold;
            font-family: 'Orbitron', sans-serif;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }

        button:hover { background: #27ae60; transform: translateY(-2px); }
    </style>
</head>
<body>

    <div class="header-container">
        <div>
            <h2><i class="fa-solid fa-tower-broadcast"></i> Rescuer Command</h2>
        </div>
        <div>
            <span id="server-status" class="status-badge status-offline">Server: Offline</span>
            <span id="hw-status" class="status-badge hw-searching">Hardware: Scanning...</span>
        </div>
    </div>
    
    <div class="container">
        <div class="card" id="vital-card">
            <i class="fa-solid fa-heart-pulse pulse-icon"></i>
            <h3>Vital Sign</h3>
            <div class="bpm-val">
                <span id="bpm">--</span> 
                <small id="status-label" style="font-size: 0.8rem; color: #95a5a6; display: block; margin-top: -5px; font-family: 'Rajdhani';">AWAITING HARDWARE...</small>
            </div>
        </div>

        <div class="card location">
            <i class="fa-solid fa-location-dot"></i>
            <h3>GPS Location</h3>
            <div class="geo-info">LAT: <span id="lat" style="color: #2c3e50;">--.-----</span></div>
            <div class="geo-info">LNG: <span id="lng" style="color: #2c3e50;">--.-----</span></div>
            <div style="font-size: 0.7rem; color: var(--secondary); margin-top: 5px;">LIVE AUTO-FOLLOW ACTIVE</div>
        </div>
    </div>

    <div id="map"></div>

    <div class="cmd-section">
        <h3 style="margin:0; font-size: 1rem; color: #7f8c8d;">DISPATCH COMMAND</h3>
        <div class="input-group">
            <input type="text" id="cmdInput" placeholder="Enter objective for Responder OLED...">
            <button onclick="sendCommand()" id="transmitBtn">Transmit <i class="fa-solid fa-signal"></i></button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const socket = io();
        const serverStatus = document.getElementById('server-status');
        const hwStatus = document.getElementById('hw-status');
        const vitalCard = document.getElementById('vital-card');
        const bpmEl = document.getElementById('bpm');
        const statusLabel = document.getElementById('status-label');
        
        // Map Setup
        const map = L.map('map').setView([14.4791, 121.0194], 17);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        let marker = L.circleMarker([14.4791, 121.0194], {
            radius: 10, fillColor: "#e74c3c", color: "#fff", weight: 3, opacity: 1, fillOpacity: 0.9
        }).addTo(map);

        // Server Connection Logic
        socket.on('connect', () => {
            serverStatus.innerText = "Server: Online";
            serverStatus.className = "status-badge status-online";
        });

        socket.on('disconnect', () => {
            serverStatus.innerText = "Server: Offline";
            serverStatus.className = "status-badge status-offline";
        });

        // Hardware Status Logic
        socket.on('device_status', (data) => {
            if(data.connected) {
                hwStatus.innerText = "Hardware: Connected";
                hwStatus.className = "status-badge hw-connected";
            } else {
                hwStatus.innerText = "Hardware: Scanning...";
                hwStatus.className = "status-badge hw-searching";
                bpmEl.innerText = "--";
                statusLabel.innerText = "AWAITING HARDWARE...";
                statusLabel.style.color = "#95a5a6";
            }
        });
        
        // PURE MONITORING & AUTOMATIC ALERT DETECTION
        socket.on('update_data', (data) => {
            // Update Vitals
            bpmEl.innerText = data.bpm;
            
            // AUTOMATIC ALERT DETECTION
            if(data.emergency) {
                vitalCard.classList.add('emergency-alert');
                statusLabel.innerText = "!!! CRITICAL CONDITION !!!";
                statusLabel.style.color = "#e74c3c";
                map.flyTo([data.lat, data.lng], 18); // Auto-zoom pag emergency
            } else {
                vitalCard.classList.remove('emergency-alert');
                statusLabel.innerText = "SYSTEM NORMAL";
                statusLabel.style.color = "#2ecc71";
            }

            // PURE MONITORING: Automatic Map Following
            if (data.lat && data.lng) {
                document.getElementById('lat').innerText = data.lat.toFixed(5);
                document.getElementById('lng').innerText = data.lng.toFixed(5);
                
                const newPos = [data.lat, data.lng];
                marker.setLatLng(newPos);
                map.panTo(newPos); // Kusa siyang susunod sa responder
            }
        });

        // COMMAND DISPATCH (UNTOUCHED LOGIC)
        function sendCommand() {
            const cmdInput = document.getElementById('cmdInput');
            const transmitBtn = document.getElementById('transmitBtn');
            const msg = cmdInput.value;
            
            if(!msg.trim()) return;
            
            socket.emit('send_command', { message: msg });

            const originalText = transmitBtn.innerHTML;
            transmitBtn.innerHTML = "SENT <i class='fa-solid fa-check'></i>";
            transmitBtn.style.background = "#3498db";
            
            setTimeout(() => {
                transmitBtn.innerHTML = originalText;
                transmitBtn.style.background = "#2ecc71";
                cmdInput.value = "";
            }, 1500);
        }
    </script>
</body>
</html>
